server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain;

    # JS/CSS de Next llevan un hash en el nombre: se pueden guardar para siempre
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /img/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # El HTML se revalida siempre, asi cada despliegue se ve de inmediato
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}
